name: Auto Purge jsDelivr
on:
  push:
    branches: [main]
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Purge changed files on jsDelivr
        run: |
          REPO="fitriaprikartinidarsono/mod-bussid-livery-bus-truk"
          BRANCH="main"
          git diff --name-only HEAD^ HEAD | while read -r file; do
            if [ -f "$file" ]; then
              ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$file")
              URL="https://purge.jsdelivr.net/gh/$REPO@$BRANCH/$ENCODED"
              echo "Purging: $URL"
              curl -s "$URL"
            fi
          done
